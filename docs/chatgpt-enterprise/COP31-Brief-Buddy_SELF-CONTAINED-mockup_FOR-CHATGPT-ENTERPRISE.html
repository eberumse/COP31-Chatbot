<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>COP31 Brief Buddy</title>
  <meta name="description" content="At-a-glance ministerial briefings for COP31 — next engagement, talking points, and a source-grounded ask." />
  <meta name="theme-color" content="#0b1220" />

  <style>
/* ============================================================
   COP31 Brief Buddy — professional, theme-switchable UI
   Light (daylight/corporate) + Dark (command console).
   No external fonts or dependencies.
   ============================================================ */

/* ---------- Design tokens ---------- */
/* Dark theme only. */
:root {
  --bg:        #0b1220;
  --bg-grad:   radial-gradient(1100px 520px at 12% -12%, rgba(56,189,248,.12), transparent 56%),
               radial-gradient(1000px 480px at 100% -6%, rgba(129,140,248,.12), transparent 52%),
               radial-gradient(900px 520px at 50% 108%, rgba(45,212,191,.08), transparent 60%);
  --panel:     rgba(17,26,44,.82);
  --panel-2:   rgba(20,31,54,.66);
  --inset:     rgba(3,9,20,.34);
  --line:      rgba(148,171,204,.16);
  --line-2:    rgba(148,171,204,.28);
  --text:      #e9f1fb;
  --muted:     #9fb1c8;
  --faint:     #6b7d95;
  --accent:    #38bdf8;   /* sky */
  --accent-2:  #a78bfa;
  --accent-soft:rgba(56,189,248,.12);
  --accent-ink:#bde9ff;
  --warn:      #f4b45f;
  --warn-soft: rgba(244,180,95,.12);
  --danger:    #fb7185;
  --danger-soft:rgba(251,113,133,.12);
  --ok:        #34d399;
  --ok-soft:   rgba(52,211,153,.12);
  --shadow:    0 1px 2px rgba(0,0,0,.3), 0 24px 60px rgba(0,0,0,.42);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.34);
  --r-xl: 22px; --r-lg: 18px; --r-md: 14px; --r-sm: 10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Helvetica Neue", sans-serif;
  --nav-w: 88px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg-grad), var(--bg);
  background-attachment: fixed;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 20px; height: 20px; display: block; }
[data-icon] { display: inline-flex; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }

.sidenav {
  position: sticky; top: 0; height: 100vh; z-index: 20;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: calc(16px + var(--safe-t)) 12px 16px;
  border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 82%, transparent);
  backdrop-filter: blur(20px);
}
.brand { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; margin-bottom: 10px; background: linear-gradient(145deg, var(--accent), var(--accent-2)); box-shadow: var(--shadow-sm); color: #fff; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.nav { display: flex; flex-direction: column; gap: 6px; width: 100%; align-items: center; }
.nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; }
.nav-btn {
  width: 64px; padding: 9px 4px; border: 1px solid transparent; border-radius: 15px;
  background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; transition: 140ms ease;
}
.nav-btn em { font-style: normal; }
.nav-btn:hover { color: var(--text); background: color-mix(in srgb, var(--muted) 12%, transparent); }
.nav-btn.active { color: var(--accent-ink); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 32%, transparent); }

/* ---------- Main ---------- */
.main { min-width: 0; padding: calc(20px + var(--safe-t)) clamp(16px, 3.4vw, 40px) 60px; max-width: 1180px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 20px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
}
.eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 16%, transparent); }
h1 { margin-top: 8px; font-size: clamp(24px, 3.2vw, 34px); letter-spacing: -.02em; line-height: 1.05; }
.updated-line { font-size: 12.5px; color: var(--faint); margin-top: 8px; }
.subhead { color: var(--muted); margin-top: 6px; font-size: 14px; }
.topbar-side { display: flex; gap: 8px; align-items: center; flex: none; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 13px; box-shadow: var(--shadow-sm);
}
.pill.clock { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.pill.icon-only { padding: 9px; }
.pill svg { width: 18px; height: 18px; }

/* ---------- Banner ---------- */
.banner {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 28%, transparent);
  font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 12px; margin-bottom: 18px;
}

/* ---------- Panes ---------- */
.pane { display: none; }
.pane.active { display: block; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- Panels / cards ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow); }
[data-theme="dark"] .panel { backdrop-filter: blur(20px); }
.card-pad { padding: clamp(18px, 2.4vw, 26px); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 18px; align-items: start; }
.rail { display: grid; gap: 16px; }

/* ---------- Next hero ---------- */
.hero { position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 260px at 88% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%); pointer-events: none; }
.hero-in { position: relative; z-index: 1; }
.kicker { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.count-badge {
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 750;
  padding: 7px 12px; border-radius: 999px; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.type-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; padding: 6px 10px; border-radius: 999px; color: var(--accent-ink);
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
}
.hero-time { margin-top: 16px; font-size: clamp(44px, 8vw, 68px); font-weight: 800; letter-spacing: -.04em; line-height: .95; font-variant-numeric: tabular-nums; }
.hero-when { color: var(--muted); font-size: 14px; margin-top: 4px; }
.hero-title { margin-top: 14px; font-size: clamp(21px, 3vw, 28px); font-weight: 750; letter-spacing: -.02em; line-height: 1.15; }
.meta-strip { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.meta-item { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 11px; border: 1px solid var(--line); background: var(--inset); color: var(--muted); font-size: 13px; }
.meta-item svg { width: 16px; height: 16px; }

.flag-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 16px; }
.flag {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); background: var(--inset);
}
.flag.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); background: var(--danger-soft); }
.flag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: var(--warn-soft); }

.blocktitle { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.blocktitle svg { width: 17px; height: 17px; color: var(--accent); }

.objective { margin-top: 22px; padding: 16px; border-radius: var(--r-lg); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); background: var(--accent-soft); }
.objective .blocktitle { color: var(--accent-ink); }
.objective p { color: var(--text); font-size: 15.5px; line-height: 1.5; margin-top: 8px; }

.talk-list { display: grid; gap: 10px; margin-top: 14px; }
.talk { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; padding: 14px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel-2); }
.talk-n { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 750; font-size: 14px; background: linear-gradient(145deg, var(--accent), var(--accent-2)); }
.talk-c { color: var(--text); font-size: 15px; line-height: 1.45; }
.src-row { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; }
.src { font-size: 11.5px; color: var(--muted); padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--inset); }
.src.web { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 30%, transparent); background: color-mix(in srgb, var(--accent-2) 8%, transparent); }

.callout { margin-top: 14px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel-2); }
.callout.danger { border-color: color-mix(in srgb, var(--danger) 30%, transparent); background: var(--danger-soft); }
.callout .blocktitle { color: var(--danger); }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: var(--warn-soft); }
.callout.warn .blocktitle { color: var(--warn); }
.callout p { margin-top: 7px; font-size: 14.5px; line-height: 1.5; }
.callout.danger p { color: var(--danger); font-weight: 550; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 15px; border-radius: 13px;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--text); font-weight: 650; font-size: 14px;
  transition: 140ms ease; box-shadow: var(--shadow-sm); text-decoration: none;
}
.btn:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 40%, var(--line-2)); }
.btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn svg { width: 17px; height: 17px; }
.btn.wide { width: 100%; }

/* ---------- Counterpart ---------- */
.cp-top { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 14px; align-items: center; }
.cp-photo { width: 72px; height: 72px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line-2); background: var(--inset); position: relative; }
.cp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cp-photo .flagbadge { position: absolute; right: -3px; bottom: -3px; font-size: 17px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.cp-avatar { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px; position: relative; }
.cp-avatar .flagbadge { position: absolute; right: -3px; bottom: -3px; font-size: 17px; }
.cp-name { font-size: 18px; font-weight: 750; letter-spacing: -.01em; }
.cp-role { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.35; }
.photo-note { font-size: 10.5px; color: var(--faint); margin-top: 6px; font-style: italic; }
.cp-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 16px; }
.mini { padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--inset); }
.mini .l { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.mini .v { color: var(--text); font-size: 13px; margin-top: 5px; line-height: 1.4; }
.public-ctx { margin-top: 14px; padding: 13px 14px; border-radius: var(--r-md); border: 1px solid color-mix(in srgb, var(--accent-2) 24%, transparent); background: color-mix(in srgb, var(--accent-2) 7%, transparent); }
.public-ctx .blocktitle { color: var(--accent-2); }
.public-ctx p { font-size: 13px; line-height: 1.5; margin-top: 7px; color: var(--text); }

/* ---------- Schedule ---------- */
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.section-h h2 { font-size: 19px; letter-spacing: -.01em; }
.section-h .hint { color: var(--faint); font-size: 12.5px; }
.timeline { display: grid; gap: 10px; }
.tl-item {
  width: 100%; text-align: left; color: inherit; display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 14px; align-items: center;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); box-shadow: var(--shadow-sm); transition: 140ms ease; position: relative;
}
.tl-item.linkable:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-1px); }
.tl-item.now { border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 26%, transparent), var(--shadow-sm); }
.tl-item.done { opacity: .6; }
.tl-time { font-weight: 750; font-size: 15px; font-variant-numeric: tabular-nums; }
.tl-time .e { display: block; font-size: 11.5px; color: var(--faint); font-weight: 500; }
.tl-title { font-size: 15px; font-weight: 640; line-height: 1.25; }
.tl-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 3px 7px; border-radius: 7px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }
.tag.completed { background: var(--ok-soft); color: var(--ok); }
.tag.next { background: var(--accent-soft); color: var(--accent-ink); }
.tag.upcoming { background: color-mix(in srgb, var(--accent-2) 12%, transparent); color: var(--accent-2); }
.tl-chev { color: var(--faint); }

/* ---------- Briefs (list + detail) ---------- */
.split { display: grid; grid-template-columns: minmax(260px, .82fr) minmax(0, 1.18fr); gap: 18px; align-items: start; }
.pick-list { display: grid; gap: 10px; }
.pick {
  width: 100%; text-align: left; color: inherit; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-lg);
  background: var(--panel); box-shadow: var(--shadow-sm); display: grid; gap: 6px; transition: 140ms ease;
}
.pick:hover { border-color: color-mix(in srgb, var(--accent) 36%, var(--line)); }
.pick.active { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); }
.pick .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.pick .t { font-weight: 700; font-size: 14.5px; }
.pick .m { color: var(--muted); font-size: 12.5px; }

.detail-title { font-size: clamp(20px, 2.6vw, 26px); font-weight: 760; letter-spacing: -.02em; margin-top: 4px; }
.ai-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent); padding: 5px 9px; border-radius: 999px; }
.changed-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.date-chip { font-variant-numeric: tabular-nums; font-weight: 650; color: var(--text); background: var(--inset); border: 1px solid var(--line); padding: 3px 8px; border-radius: 8px; }
.arrow-i { color: var(--faint); }
.change-list { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.change-list li { position: relative; padding-left: 20px; font-size: 14px; color: var(--text); line-height: 1.45; }
.change-list li::before { content: ""; position: absolute; left: 4px; top: 8px; width: 7px; height: 7px; border-radius: 3px; background: var(--accent); }

/* ---------- Ask ---------- */
.ask-wrap { display: grid; grid-template-columns: minmax(0,.92fr) minmax(0,1.08fr); gap: 18px; align-items: start; }
.field-label { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.select {
  width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line-2);
  background: var(--panel); color: var(--text); font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow-sm);
  appearance: none; background-image: none;
}
.explain { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; padding: 11px 13px; border-radius: var(--r-md); background: var(--inset); border: 1px solid var(--line); }
.explain b { color: var(--text); }
.mode-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.mode {
  padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); background: var(--panel);
  font-size: 12.5px; font-weight: 600; transition: 120ms ease;
}
.mode:hover { color: var(--text); }
.mode.active { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.ask-box { display: flex; gap: 10px; margin-top: 16px; }
.ask-input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--panel); color: var(--text); outline: none; box-shadow: var(--shadow-sm); }
.ask-input:focus { border-color: color-mix(in srgb, var(--accent) 50%, var(--line-2)); }
.ask-send { padding: 12px 16px; border-radius: var(--r-md); border: 0; color: #fff; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.brief-select { margin-bottom: 16px; }
.ask-block { margin-top: 4px; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.suggest { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); background: var(--panel); font-size: 12.5px; font-weight: 600; transition: 120ms ease; }
.suggest:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 40%, var(--line-2)); }

/* ---------- Week calendar ---------- */
.wk-legend { font-weight: 500; color: var(--faint); text-transform: none; letter-spacing: 0; margin-left: 6px; }
.week-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 14px; -webkit-overflow-scrolling: touch; }
.day-chip { flex: 0 0 auto; min-width: 62px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--muted); box-shadow: var(--shadow-sm); transition: 140ms ease; }
.day-chip:hover { border-color: color-mix(in srgb, var(--accent) 36%, var(--line)); }
.day-chip.today { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.day-chip.sel { background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.dc-dow { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
.dc-num { font-size: 20px; font-weight: 800; line-height: 1.05; }
.dc-mon { font-size: 10.5px; opacity: .8; }
.dc-meta { font-size: 10px; margin-top: 3px; opacity: .8; white-space: nowrap; }
.dc-meta b { color: var(--accent); }
.day-chip.sel .dc-meta b { color: #fff; }
.empty-day { color: var(--faint); font-size: 14px; padding: 20px 4px; }

/* ---------- Anticipated questions (enriched) ---------- */
.aq-intro { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
.aq-list { display: grid; gap: 12px; margin-top: 14px; }
.aq { padding: 15px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel-2); }
.aq-q { font-size: 15.5px; font-weight: 700; color: var(--text); }
.aq-why { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; }
.aq-consider { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 11px; }
.aq-clabel { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.aq-c { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--text); line-height: 1.45; margin-bottom: 8px; }
.aq-c:last-child { margin-bottom: 0; }
.aq-c .src-tag, .aq-why .src-tag { flex: none; margin-top: 1px; }

/* Source tags: INTERNAL (cleared) vs PUBLIC (indicative) */
.src-tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.src-tag.int { color: var(--ok); background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }
.src-tag.pub { color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent-2) 30%, transparent); }
.src-tag.both { color: var(--warn); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }

/* Ask answer variants */
.answer.public { border-color: color-mix(in srgb, var(--accent-2) 30%, transparent); background: color-mix(in srgb, var(--accent-2) 8%, transparent); }
.answer.none { border-color: var(--line-2); background: var(--panel-2); }
.answer {
  margin-top: 16px; border-radius: var(--r-lg); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  background: var(--accent-soft); padding: 18px; min-height: 200px;
}
.answer.unsupported { border-color: color-mix(in srgb, var(--warn) 34%, transparent); background: var(--warn-soft); }
.answer .atag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 650; color: var(--accent-ink); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); background: var(--panel); padding: 6px 10px; border-radius: 999px; margin-bottom: 12px; }
.answer.unsupported .atag { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 34%, transparent); }
.answer p { color: var(--text); line-height: 1.55; margin-top: 8px; }
.answer ul { margin: 10px 0 0; padding-left: 18px; }
.answer li { color: var(--text); line-height: 1.5; margin-bottom: 8px; }
.answer .basis { color: var(--muted); font-size: 12.5px; }
.qa-list { display: grid; gap: 10px; margin-top: 12px; }
.qa { padding: 13px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); }
.qa strong { display: block; font-size: 14px; color: var(--text); margin-bottom: 5px; }
.qa span { color: var(--muted); font-size: 12.5px; line-height: 1.45; }

/* ---------- Settings ---------- */
.set-grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.set-card { padding: 18px; }
.set-card h3 { font-size: 15px; margin-bottom: 4px; }
.set-card p { color: var(--muted); font-size: 13px; margin-bottom: 12px; line-height: 1.45; }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--inset); border: 1px solid var(--line); gap: 4px; }
.seg button { padding: 8px 14px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); font-weight: 650; font-size: 13.5px; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm); }
.kv { font-size: 13px; color: var(--muted); } .kv b { color: var(--text); }
.input-inline { width: 100%; padding: 11px 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--panel); color: var(--text); font-size: 14px; }
.hintline { font-size: 12px; color: var(--faint); text-align: center; margin-top: 14px; }

/* ---------- Mobile nav ---------- */
.mobilenav { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidenav { display: none; }
  .main { padding: calc(16px + var(--safe-t)) 16px calc(90px + var(--safe-b)); max-width: 640px; margin: 0 auto; }
  .grid-2, .split, .ask-wrap, .set-grid { grid-template-columns: 1fr; }
  .topbar-side .pill.clock { display: none; }
  .mobilenav {
    position: fixed; left: 10px; right: 10px; bottom: calc(8px + var(--safe-b)); z-index: 40;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 7px;
    border: 1px solid var(--line); border-radius: 20px; background: color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter: blur(20px); box-shadow: var(--shadow);
  }
  .mobilenav .nav-btn { width: 100%; padding: 7px 2px; border-radius: 13px; }
}
@media (max-width: 380px) { .hero-time { font-size: 42px; } }

      + '<div class="hero-title">'+esc(e.title)+'</div>'
      + '<div class="meta-strip"><span class="meta-item">'+ic("pin")+esc(e.venue)+'</span></div>'
      + (flags?'<div class="flag-row">'+flags+'</div>':'')
      + '<div class="objective"><div class="blocktitle">'+ic("target")+' Objective</div><p>'+esc(e.objective)+'</p></div>'
      + '<div style="margin-top:22px" class="blocktitle">'+ic("chat")+' Main talking points</div>'+talkingHTML(e)
      + watchHTML(e)
      + '<div class="btn-row"><button class="btn primary" data-openbrief="'+esc(e.id)+'">'+ic("doc")+' Open full brief</button></div>'
      + '</div></div>';
    var rail='<div class="rail">'+counterpartHTML(e)+'</div>';
    el("next-root").innerHTML='<div class="grid-2">'+main+rail+'</div>';
  }

  /* ---------- SCHEDULE (week calendar) ---------- */
  function renderSchedule(){
    var now=effectiveNow(), dates=scheduleDates(), todayStr=ymd(now);
    if(!state.selDate || dates.indexOf(state.selDate)<0) state.selDate = dates.indexOf(todayStr)>=0?todayStr:(dates[0]||todayStr);
    var nextId=(nextEngagement().hero||{}).id;
    var strip=dates.map(function(d){
      var dt=parseDT(d), count=(state.data.schedule||[]).filter(function(x){return x.date===d;}).length;
      var briefed=(state.data.schedule||[]).some(function(x){return x.date===d && x.engagementId;});
      return '<button class="day-chip'+(d===state.selDate?" sel":"")+(d===todayStr?" today":"")+'" data-day="'+esc(d)+'">'
        + '<span class="dc-dow">'+DOW[dt.getDay()]+'</span><span class="dc-num">'+dt.getDate()+'</span><span class="dc-mon">'+MON[dt.getMonth()]+'</span>'
        + '<span class="dc-meta">'+(count?count+(count===1?" item":" items"):"—")+(briefed?' <b>•</b>':'')+'</span></button>';
    }).join("");
    var items=(state.data.schedule||[]).filter(function(x){return x.date===state.selDate;}).sort(function(a,b){return itemDT(a)-itemDT(b);});
    var rows=items.map(function(it){
      var s=itemDT(it), en=itemEnd(it), link=!!it.engagementId;
      var isNow=s<=now&&now<en, isDone=en<now&&!isNow, isNext=it.engagementId&&it.engagementId===nextId&&!isNow;
      var tag=isNow?'<span class="tag next">Now</span>':isNext?'<span class="tag next">Next</span>':isDone?'<span class="tag completed">Done</span>':'<span class="tag upcoming">Upcoming</span>';
      var sub=link?'<span class="tag">'+esc(engType(it.engagementId))+'</span>'+esc(it.venue):esc(it.venue);
      return '<'+(link?'button':'div')+' class="tl-item'+(link?' linkable':'')+(isNow?' now':'')+(isDone?' done':'')+'"'+(link?' data-openbrief="'+esc(it.engagementId)+'"':'')+'>'
        + '<div class="tl-time">'+esc(it.time)+'<span class="e">'+esc(it.end||"")+'</span></div>'
        + '<div><div class="tl-title">'+esc(it.title)+'</div><div class="tl-sub">'+sub+'</div></div>'
        + '<div>'+tag+(link?'<span class="tl-chev">'+ic("chevron")+'</span>':'')+'</div>'
        + '</'+(link?'button':'div')+'>';
    }).join("") || '<div class="empty-day">Nothing scheduled for this day.</div>';
    el("schedule-root").innerHTML='<div class="field-label">This week <span class="wk-legend">• = has a full brief</span></div><div class="week-strip">'+strip+'</div>'
      + '<div class="section-h"><h2>'+esc(fmtDay(parseDT(state.selDate)))+'</h2><span class="hint">Tap a briefed item for the full brief</span></div>'
      + '<div class="timeline">'+rows+'</div>';
  }
  function engType(id){ var e=byId(id); return e?e.type:""; }

  /* ---------- BRIEFS (merged: read + ask) ---------- */
  var SUGGEST = ["Give me the 20-second version", "Which country is blocking the deal?", "What must I avoid?"];
  function renderBriefs(){
    var e=byId(state.briefId)||engagements()[0];
    if(!e){ el("briefs-root").innerHTML='<div class="panel card-pad">No briefs loaded.</div>'; return; }
    var start=new Date(e.start);
    var opts=engagements().map(function(x){ return '<option value="'+esc(x.id)+'"'+(x.id===e.id?" selected":"")+'>'+esc(x.title)+' — '+esc(x.type)+'</option>'; }).join("");
    var selector='<div class="panel card-pad brief-select"><div class="field-label">Choose a meeting</div><select class="select" id="briefSelect">'+opts+'</select></div>';

    var chips=SUGGEST.map(function(q){ return '<button class="suggest" data-ask="'+esc(q)+'">'+esc(q)+'</button>'; }).join("");
    var main='<div class="panel card-pad">'
      + '<span class="ai-tag">'+ic("spark")+' AI-generated · source-grounded</span>'
      + '<div class="detail-title">'+esc(e.title)+'</div>'
      + '<div class="meta-strip"><span class="meta-item">'+ic("clock")+esc(fmtClock(start))+'–'+esc(fmtClock(new Date(e.end)))+'</span><span class="meta-item">'+ic("pin")+esc(e.venue)+'</span><span class="type-chip">'+esc(e.type)+'</span></div>'
      + (e.updated?'<div class="updated-line">Updated '+esc(fmtDate(e.updated))+'</div>':'')
      + '<div class="objective"><div class="blocktitle">'+ic("target")+' Objective</div><p>'+esc(e.objective)+'</p></div>'
      + '<div style="margin-top:22px" class="blocktitle">'+ic("chat")+' Main talking points <span style="color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0"> · tone: '+esc(e.tone)+'</span></div>'+talkingHTML(e)
      + watchHTML(e)
      + anticipatedHTML(e)
      + '<div class="ask-block"><div style="margin-top:24px" class="blocktitle">'+ic("chat")+' Ask about this brief</div>'
      + '<p class="aq-intro">Answers come from your cleared brief first; only if it’s not covered will a tentative public note appear.</p>'
      + '<div class="chip-row">'+chips+'</div>'
      + '<div class="ask-box"><input class="ask-input" id="askInput" placeholder="Ask anything about this brief…"><button class="ask-send" id="askSend">Ask</button></div>'
      + '<div id="answer-slot"></div></div>'
      + '</div>';
    var rail='<div class="rail">'+counterpartHTML(e)+'</div>';
    el("briefs-root").innerHTML=selector+'<div class="grid-2">'+main+rail+'</div>';
  }
  function answer(q){
    var e=byId(state.briefId)||engagements()[0]; if(!e) return;
    var lower=(q||"").toLowerCase().trim(); if(!lower) return;
    var cls="", tag="", body="", srcs="";
    // 1) Brief-first: watch point / commitments / numbers -> cleared guardrail
    if(/avoid|watch|risk|careful|red.?line|sensitiv|commit|concession|promise|new (finance|money|fund)|pledge|guarantee|how much|number|figure|announce/.test(lower)){
      tag=srcTag("INTERNAL")+' From your brief';
      body='<p><strong>Watch point:</strong> '+esc(e.watchPoint)+'</p>'+(e.ifAsked?'<p>If pressed, you can say: '+esc(e.ifAsked)+'</p>':'');
      srcs=briefSrcRow(e);
    }
    // 2) Brief-first: summary / talking points / objective
    else if(/summar|gist|20.?sec|short|main point|talking point|what.*(say|convey|tell)|objective|aim|goal|key point/.test(lower)){
      tag=srcTag("INTERNAL")+' From your brief';
      body='<p>'+esc(e.objective)+'</p><ul>'+(e.sayThis||[]).map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul><p class="basis" style="margin-top:8px">Tone: '+esc(e.tone)+'</p>';
      srcs=briefSrcRow(e);
    }
    else {
      // 3) Out of brief -> tentative public, else not covered
      var pi=(e.publicInfo||[]).filter(function(p){ return (p.keywords||[]).some(function(k){ return lower.indexOf(k)>=0; }); })[0];
      if(pi){ cls="public"; tag=srcTag("PUBLIC")+' Public domain · indicative';
        body='<p><em>Not in your cleared brief.</em> Publicly — and to be treated as indicative only — '+esc(pi.text)+'</p><p class="basis" style="margin-top:8px">Tentative; verify before use and lean on your cleared brief and negotiators.</p>';
      } else { cls="none"; tag=srcTag("INTERNAL")+' Not in your cleared brief';
        body='<p>Your cleared brief doesn’t cover that, and there’s nothing reliable in the loaded public notes.</p><p class="basis" style="margin-top:8px">Check with your negotiators. (In production, your enterprise AI would attempt a fuller, sourced answer here.)</p>';
      }
    }
    var slot=el("answer-slot"); if(slot) slot.innerHTML='<div class="answer '+cls+'"><span class="atag">'+tag+'</span>'+body+srcs+'</div>';
  }
  function briefSrcRow(e){ return '<div class="src-row" style="margin-top:14px">'+(e.sources||[]).map(function(s){return '<span class="src">'+esc(s)+'</span>';}).join("")+'</div>'; }

  /* ---------- SETTINGS ---------- */
  function renderSettings(){
    var m=(state.data&&state.data.meta)||{}, count=engagements().length;
    var standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
    var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    el("settings-root").innerHTML='<div class="set-grid">'
      + '<div class="panel card-pad set-card"><h3>Add to Home Screen</h3>'+(standalone?'<p>✅ Installed — running as an app.</p>':isIOS?'<p>In Safari: <b>Share</b> → <b>Add to Home Screen</b>. Then it opens like an app.</p>':'<p>Use the browser menu → <b>Install app</b> / <b>Add to Home Screen</b>.</p>')+'</div>'
      + '<div class="panel card-pad set-card"><h3>Briefing content</h3><p class="kv"><b>Source:</b> '+(state.isSample?"Sample data (built in)":"Imported file")+'<br><b>Engagements:</b> '+count+(m.updatedLabel?'<br><b>Updated:</b> '+esc(m.updatedLabel):"")+'</p>'
      + '<div class="btn-row"><button class="btn primary" id="btnImport">'+ic("upload")+' Import file</button><button class="btn" id="btnExport">'+ic("download")+' Export</button>'+(state.isSample?"":'<button class="btn ghost" id="btnReset">'+ic("refresh")+' Reset to sample</button>')+'</div></div>'
      + '<div class="panel card-pad set-card"><h3>Simulate a time <span style="color:var(--faint);font-weight:400">(demo)</span></h3><p>Preview any moment of the conference day.</p>'
      + '<input type="datetime-local" class="input-inline" id="demoInput" value="'+esc(toLocalInput(state.demoTime?new Date(state.demoTime):effectiveNow()))+'">'
      + '<div class="btn-row"><button class="btn" id="btnSetTime">Use this time</button>'+(state.demoTime?'<button class="btn ghost" id="btnRealTime">Use real time</button>':"")+'</div></div>'
      + '<div class="panel card-pad set-card"><h3>About</h3><p class="kv">COP31 Brief Buddy · fictional dummy data for testing. Content you import stays in this browser on this device. '+esc(m.classification||"")+'</p></div>'
      + '</div><div class="hintline">COP31 Brief Buddy</div>';
  }
  function toLocalInput(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }

  /* ---------- chrome / nav ---------- */
  function updateChrome(){
    var m=(state.data&&state.data.meta)||{};
    el("confLabel").textContent = (m.conference||"COP31").split("—")[0].trim();
    el("classLabel").textContent = state.isSample ? "Sample" : "Live";
    el("appTitle").textContent = m.app||"COP31 Brief Buddy";
    var p=m.principal||{};
    el("principalLabel").textContent = p.name ? (p.flag?p.flag+" ":"")+p.name+(p.delegation?" · "+p.delegation:"") : "";
    var msgs=[]; if(state.isSample) msgs.push("⚠︎ Sample data — fictional, for testing"); if(state.demoTime) msgs.push("⏱ Simulated time"); else if(state.simulated) msgs.push("🔬 Preview (simulated time)");
    var b=el("banner"); if(msgs.length){ b.hidden=false; b.textContent=msgs.join("   ·   "); } else b.hidden=true;
    document.querySelectorAll("[data-tab]").forEach(function(btn){ btn.classList.toggle("active", btn.dataset.tab===state.view); });
  }
  function go(view){ state.view=view; document.querySelectorAll(".pane").forEach(function(s){ s.classList.toggle("active", s.id==="tab-"+view); });
    if(view==="next") renderNext(); else if(view==="schedule") renderSchedule(); else if(view==="briefs") renderBriefs(); else if(view==="settings") renderSettings();
    updateChrome(); window.scrollTo(0,0);
  }

  /* ---------- import/export ---------- */
  function importFile(file){ var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d.engagements||!Array.isArray(d.engagements)) throw new Error("no engagements"); localStorage.setItem(LS_DATA,r.result); state.data=normalize(d); state.isSample=!!(d.meta&&d.meta.isSampleData); state.demoTime=""; localStorage.removeItem(LS_DEMO); afterLoad(); go("next"); }catch(err){ alert("Could not read that file — it must be a Brief Buddy JSON with an \"engagements\" list.\n\n("+err.message+")"); } }; r.readAsText(file); }
  function exportData(){ var t=JSON.stringify(state.data,null,2), b=new Blob([t],{type:"application/json"}), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="brief-buddy.json"; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400); }
  function resetSample(){ localStorage.removeItem(LS_DATA); state.demoTime=""; localStorage.removeItem(LS_DEMO); loadData().then(function(){ go("next"); }); }

  /* ---------- events ---------- */
  document.addEventListener("click", function(ev){
    var t=ev.target;
    var tab=t.closest("[data-tab]"); if(tab){ go(tab.dataset.tab); return; }
    var dc=t.closest("[data-day]"); if(dc){ state.selDate=dc.dataset.day; renderSchedule(); return; }
    var ob=t.closest("[data-openbrief]"); if(ob){ state.briefId=ob.dataset.openbrief; go("briefs"); return; }
    var sg=t.closest("[data-ask]"); if(sg){ var qi=el("askInput"); if(qi) qi.value=sg.dataset.ask; answer(sg.dataset.ask); return; }
    var id=(t.closest("button")||{}).id;
    if(id==="btnImport") el("fileInput").click();
    else if(id==="btnExport") exportData();
    else if(id==="btnReset"){ if(confirm("Replace current content with the built-in sample?")) resetSample(); }
    else if(id==="btnSetTime"){ var v=el("demoInput").value; if(v){ state.demoTime=new Date(v).toISOString(); localStorage.setItem(LS_DEMO,state.demoTime); go("next"); } }
    else if(id==="btnRealTime"){ state.demoTime=""; localStorage.removeItem(LS_DEMO); go("next"); }
    else if(id==="askSend"){ answer(el("askInput").value); }
  });
  document.addEventListener("change", function(ev){ if(ev.target.id==="briefSelect"){ state.briefId=ev.target.value; renderBriefs(); } });
  document.addEventListener("keydown", function(ev){ if(ev.key==="Enter" && ev.target.id==="askInput"){ answer(ev.target.value); } });
  el("fileInput").addEventListener("change", function(ev){ if(ev.target.files&&ev.target.files[0]) importFile(ev.target.files[0]); ev.target.value=""; });
  window.addEventListener("online", updateChrome); window.addEventListener("offline", updateChrome);
  setInterval(function(){ var c=el("liveClock"); if(c) c.textContent=fmtClock(new Date()); if(state.view==="next"&&!state.demoTime) renderNext(); }, 30000);

  if(false){ /* service worker disabled in the single-file build */
    var _hadCtrl = !!navigator.serviceWorker.controller, _reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){ if(_reloading || !_hadCtrl) return; _reloading = true; location.reload(); });
    window.addEventListener("load", function(){ navigator.serviceWorker.register("service-worker.js").catch(function(){}); });
  }

  /* ---------- boot ---------- */
  function setupIcons(){ document.querySelectorAll("[data-icon]").forEach(function(n){ n.innerHTML=ic(n.dataset.icon); }); }
  loadData().then(function(){
    setupIcons();
    el("liveClock").textContent=fmtClock(new Date());
    var h=(location.hash||"").replace(/^#/,"");
    if(h==="ask") state.view="briefs";
    else if(["schedule","briefs","settings","next"].indexOf(h)>=0) state.view=h;
    else if(h.indexOf("e/")===0){ state.briefId=h.slice(2); state.view="briefs"; }
    go(state.view);
  });
})();

</script>
</body>
</html>
